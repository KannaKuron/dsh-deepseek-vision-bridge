# dsh-deepseek-vision-bridge bundle patch
#
# The `dsh.bundle.patch` layer of the published npm package: when installed
# through the official CLI —
#
#   dsh plugin --profile <name> add dsh-deepseek-vision-bridge@<version>
#
# — the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends dsh-deepseek-vision-bridge to the bundle
# stack. The profile boot then merges this patch (a single `insert` of the
# plugin row), mounting the plugin. No profile file edits needed.
#
# If a profile already carries a manual mount line for this plugin in its own
# cordis.patch.yml, remove it before switching to the bundle channel to avoid
# double-mounting.
- insert:
    - id: deepseek-vision
      name: 'dsh-deepseek-vision-bridge'
